# ============================================================
# Nate Audio - GitHub Pages Deployment
# ============================================================
#
# This workflow builds the site with Jekyll whenever a change
# is pushed to the main branch, then publishes the generated
# site to GitHub Pages.
#
# Local development:
#   bundle exec jekyll serve --livereload
#
# Production:
#   git push -> GitHub Actions -> GitHub Pages
# ============================================================

name: Deploy Nate Audio to GitHub Pages

on:
  # Publish whenever main receives a new commit.
  push:
    branches:
      - main

  # Also allow the workflow to be started manually from GitHub.
  workflow_dispatch:

# Permissions required by GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid overlapping website deployments.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Download the repository into the GitHub Actions runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure the environment for GitHub Pages.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Build the Jekyll source into the generated _site folder.
      - name: Build Nate Audio
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # Package the generated website for the deployment job.
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      # Publish the generated website to GitHub Pages.
      - name: Deploy Nate Audio
        id: deployment
        uses: actions/deploy-pages@v4