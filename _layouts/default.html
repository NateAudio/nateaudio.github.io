<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}" />
</head>
<body>
  <div class="grid-overlay" aria-hidden="true"></div>
  <header class="nav">
    <div class="nav-logo"><a href="{{ '/' | relative_url }}">Nate Audio</a></div>
    <nav class="nav-links">
      <a href="{{ '/' | relative_url }}#hero" class="nav-link">Home</a>
      <a href="{{ '/' | relative_url }}#portfolio" class="nav-link">Portfolio</a>
      <a href="{{ '/blog/' | relative_url }}" class="nav-link">Blog</a>
      <a href="{{ '/' | relative_url }}#contact" class="nav-link">Contact</a>
    </nav>
  </header>

  <main class="post-content">
    {{ content }}
  </main>

  <script src="{{ '/js/main.js' | relative_url }}"></script>
</body>
</html>
