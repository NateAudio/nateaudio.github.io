<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1000" preserveAspectRatio="none">
  <defs>
    <linearGradient id="g-cyan" x1="0" x2="1">
      <stop offset="0%" stop-color="#3cf4ff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#3cf4ff" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="g-mag" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff4fd8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ff4fd8" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <rect width="2000" height="1000" fill="transparent" />

  <!-- evenly spaced converging lines toward vanishing point (bottom-center) -->
  <g stroke-linecap="round" stroke-width="1">
    <g stroke="url(#g-cyan)">
      <!-- left-to-center lines (evenly spaced across top) -->
      <line x1="1000" y1="1000" x2="0" y2="0" />
      <line x1="1000" y1="1000" x2="200" y2="0" />
      <line x1="1000" y1="1000" x2="400" y2="0" />
      <line x1="1000" y1="1000" x2="600" y2="0" />
      <line x1="1000" y1="1000" x2="800" y2="0" />
    </g>
    <g stroke="url(#g-mag)">
      <!-- right-to-center lines (evenly spaced across top) -->
      <line x1="1000" y1="1000" x2="1200" y2="0" />
      <line x1="1000" y1="1000" x2="1400" y2="0" />
      <line x1="1000" y1="1000" x2="1600" y2="0" />
      <line x1="1000" y1="1000" x2="1800" y2="0" />
      <line x1="1000" y1="1000" x2="2000" y2="0" />
    </g>
  </g>

  <!-- gently curved horizontal bands for perspective; reduced opacity for subtlety -->
  <g fill="none" stroke-linecap="round" stroke-width="1.2">
    <path d="M -200 820 C 300 700, 700 700, 2200 820" stroke="#3cf4ff" stroke-opacity="0.09" />
    <path d="M -200 740 C 300 620, 700 620, 2200 740" stroke="#ff4fd8" stroke-opacity="0.07" />
    <path d="M -200 660 C 300 540, 700 540, 2200 660" stroke="#3cf4ff" stroke-opacity="0.05" />
    <path d="M -200 580 C 300 460, 700 460, 2200 580" stroke="#ff4fd8" stroke-opacity="0.04" />
  </g>

  <!-- subtle center wash for depth -->
  <radialGradient id="centerWash" cx="50%" cy="85%">
    <stop offset="0%" stop-color="#ff4fd8" stop-opacity="0.03" />
    <stop offset="40%" stop-color="#3cf4ff" stop-opacity="0.02" />
    <stop offset="100%" stop-color="#000" stop-opacity="0" />
  </radialGradient>
  <circle cx="1000" cy="900" r="600" fill="url(#centerWash)" />
</svg>
